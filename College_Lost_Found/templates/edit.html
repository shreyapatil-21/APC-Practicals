{% extends "base.html" %}
{% block title %}Edit Item — College Lost & Found{% endblock %}

{% block content %}
<a href="{{ url_for('home') }}" class="back-link">&#8592; Back to Home</a>

<div class="form-container">
    <div class="form-banner {{ 'lost-banner' if item['item_type'] == 'Lost' else 'found-banner' }}">
        <span class="form-banner-icon">&#9998;</span>
        <div>
            <strong>Editing: {{ item['item_name'] }}</strong><br>
            <small>Reported as <strong>{{ item['item_type'] }}</strong> &mdash; type cannot be changed.</small>
        </div>
    </div>

    <form action="{{ url_for('edit', id=item['id']) }}" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="item_name">Item Name <span class="required">*</span></label>
                <input type="text" id="item_name" name="item_name" class="form-control"
                       value="{{ item['item_name'] }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">-- Select --</option>
                    {% set categories = ["Electronics", "Books", "Documents", "Accessories", "Clothing", "ID Card", "Keys", "Other"] %}
                    {% for cat in categories %}
                        <option value="{{ cat }}" {{ 'selected' if item['category'] == cat }}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="location">Location <span class="required">*</span></label>
                <input type="text" id="location" name="location" class="form-control"
                       value="{{ item['location'] }}" required>
            </div>
            <div class="form-group">
                <label for="date">Date <span class="required">*</span></label>
                <input type="date" id="date" name="date" class="form-control"
                       value="{{ item['date'] }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="contact">Contact Info (Optional)</label>
            <input type="text" id="contact" name="contact" class="form-control"
                   value="{{ item['contact']|default('') }}"
                   placeholder="Your roll number, phone, or email">
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea id="description" name="description" class="form-control">{{ item['description']|default('') }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full btn-lg">&#10003; Save Changes</button>
            <a href="{{ url_for('home') }}" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
